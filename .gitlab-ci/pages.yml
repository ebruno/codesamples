# .gitlab-ci/pages.yml — Publish ringbuffer docs to GitLab Pages

pages:
  stage: publish
  image: ubuntu:24.04
  before_script:
    - |
       if [ "$CI_DISPOSABLE_ENVIRONMENT" = "true" ]; then
         apt-get update && apt-get install -y --no-install-recommends doxygen graphviz make \
         python3 python3-pip python3-venv; 
       else
          echo "Running in shell runner, skip apt install";
       fi;
  script:
    - make publish-to-gitlab-pages
    - ls -l pages
    - ls -l pages/ringbuffer
    - cat pages/index.html
  publish: pages
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ringbuffer/**
